name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ruff:
    name: Ruff Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.4.4

      - name: Run Ruff linter
        run: ruff check .
